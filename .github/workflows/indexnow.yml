name: IndexNow après déploiement Render
# Envoi automatique : fait par le serveur après chaque démarrage sur Render (backend/src/common/indexnow.ts).
# Ce workflow reste pour un envoi manuel (onglet Actions → Run workflow).
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Soumettre le sitemap à IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run seo:indexnow
