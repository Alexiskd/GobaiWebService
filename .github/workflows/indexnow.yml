name: IndexNow après déploiement Render
on:
  workflow_dispatch:
  deployment_status:

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Soumettre le sitemap à IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run seo:indexnow
