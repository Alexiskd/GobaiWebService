{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gobai Pygame — Système solaire</title>
  <style>
    body { background: #080a14; color: #dce0eb; font-family: sans-serif; margin: 0; padding: 2rem; }
    h1 { font-size: 1.3rem; font-weight: 600; }
    p { color: #828aa0; font-size: .9rem; }
    .cadre { max-width: 1280px; }
    iframe { border: 1px solid #2a3350; border-radius: 8px; background: #080a14; width: 100%; aspect-ratio: 1280 / 800; display: block; }
  </style>
</head>
<body>
  <h1>Gobai Pygame — Système solaire</h1>
  <p>
    Portage WebAssembly du prototype pygame (moteur képlérien de Gobai Space), servi par Django.
    Clic : sélectionner un astre — glisser : déplacer — molette : zoom — espace : pause — ↑/↓ : vitesse du temps.
  </p>
  <div class="cadre">
    <iframe src="{% static 'game/index.html' %}" title="Gobai Pygame" allow="autoplay"></iframe>
  </div>
</body>
</html>
