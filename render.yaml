# Gobai Space — application Rust (Axum) déployable sur Render.
# Le serveur Rust sert le frontend compilé et l'API d'éphémérides képlériennes.
services:
  - type: web
    name: gobai-server-rust
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
