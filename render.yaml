# Render Blueprint : un seul service web (API NestJS + site React servi par l'API).
# Build : installe et compile frontend puis backend. Start : node backend/dist/main.js (dossier backend).
services:
  # Un service web.
  - type: web
    # Son nom.
    name: gobai-space
    # Environnement Node.
    runtime: node
    # Offre gratuite.
    plan: free
    # Commande de construction.
    buildCommand: npm run build
    # Commande de démarrage.
    startCommand: npm start
    # Adresse du contrôle de santé.
    healthCheckPath: /api/health
    # Déploiement automatique à chaque fusion.
    autoDeploy: true
    # Variables d'environnement (début).
    envVars:
      # Version de Node :
      - key: NODE_VERSION
        # la 22.
        value: "22"
      # PostgreSQL Render (Internal Database URL) : stocke la collection de la galerie et les tuiles lunaires.
      - key: DATABASE_URL
        # Valeur saisie dans le tableau de bord, jamais dans le dépôt.
        sync: false
      # Clé api.nasa.gov : valeur saisie dans le tableau de bord Render, jamais dans le dépôt.
      - key: NASA_API_KEY
        # Valeur saisie dans le tableau de bord.
        sync: false
      # Secret de signature des sessions des comptes : tiré au hasard par Render, jamais écrit dans le dépôt.
      - key: SESSION_SECRET
        generateValue: true
      # API externes déconnectées : hôtes séparés par des virgules (ex. eonet.gsfc.nasa.gov,api.open-meteo.com). Vide : aucune.
      - key: BLOCKED_API_HOSTS
        # Valeur saisie dans le tableau de bord.
        sync: false
      # Clé d'administration : autorise l'onglet « API » du site à déconnecter une API sur le serveur. Jamais dans le dépôt.
      - key: API_ADMIN_TOKEN
        # Valeur saisie dans le tableau de bord.
        sync: false
      # Clé secrète Stripe (sk_test_… en mode test, sk_live_… pour de vrais paiements) : elle ouvre les dons.
      # Le serveur vérifie sa forme au démarrage et refuse une clé publique pk_… par erreur.
      - key: STRIPE_SECRET_KEY
        # Valeur saisie dans le tableau de bord, jamais dans le dépôt : c'est la seule clé de ce service qui
        # peut déplacer de l'argent.
        sync: false
      # Vols (fenêtre Trajet) : jeton de l'API de données Aviasales, programme d'affiliation Travelpayouts.
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      # Identifiant d'affilié Travelpayouts ajouté aux liens de réservation des vols (commission).
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      # Vols en direct (fenêtre Trajet) : jeton Duffel (https://duffel.com). Facultatif : sans lui, prix d'Aviasales.
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      # Liens d'affiliation des sites de billets de train (générés dans Travelpayouts ou chez le partenaire).
      # Facultatifs : sans eux, la page d'accueil du site, sans commission.
      - key: TRAIN_LINK_TRAINLINE
        sync: false
      - key: TRAIN_LINK_OMIO
        sync: false
      - key: TRAIN_LINK_RAILEUROPE
        sync: false
      - key: TRAIN_LINK_TRIPCOM
        sync: false
      - key: TRAIN_LINK_12GO
        sync: false
      # Trains (fenêtre Trajet) : clé de l'API SNCF (https://numerique.sncf.com/startup/api/token-developpeur/).
      - key: SNCF_API_KEY
        sync: false
      # Assistant : aucune clé côté serveur, chaque utilisateur se connecte avec la sienne (Claude ou Mistral).
      # PORT est fourni par Render. Les autres variables (tuiles…) : voir backend/.env.example.
