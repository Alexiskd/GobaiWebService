# Gobai Space : frontend statique + microservice proxy TAP astronomique.
services:
  - type: web
    name: static-gobai
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    autoDeploy: false
    envVars:
      - key: VITE_ASTRONOMY_PROXY_URL
        value: https://gobai-astronomy-proxy.onrender.com

  - type: web
    name: gobai-astronomy-proxy
    runtime: node
    rootDir: backend/astronomy-proxy
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: false
    envVars:
      - key: CORS_ORIGINS
        value: https://static-u4m0.onrender.com,https://www.gobaispace.com,https://gobaispace.com
