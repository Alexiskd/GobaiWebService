[package]
name = "gobai-server"
version = "2.0.0"
edition = "2024"
description = "Gobai Space — serveur Rust (Axum) : service statique du frontend et éphémérides képlériennes"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
